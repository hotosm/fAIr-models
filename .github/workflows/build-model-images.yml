name: Build Model Images

on:
  pull_request:
    paths:
      - "models/**"
      - ".github/workflows/build-model-images.yml"
      - ".github/scripts/detect_models.py"
  push:
    branches: [master]
    paths:
      - "models/**"
      - ".github/workflows/build-model-images.yml"
      - ".github/scripts/detect_models.py"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.models.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.ref }}
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv add pystac
      - id: models
        run: echo "matrix=$(uv run python .github/scripts/detect_models.py)" >>
          $GITHUB_OUTPUT
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images:
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/fair-models/${{
            matrix.name }}
          tags: |
            type=ref,event=pr,prefix=pr-
            type=raw,value=v${{ matrix.version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          target: test
          load: true
          tags: ${{ matrix.name }}:test
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Run step tests
        run: |
          docker run --rm --entrypoint "" \
            -e FAIR_FORCE_CPU=1 \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${{ matrix.name }}:test" \
            python -m pytest -o addopts='' models/${{ matrix.name }}/tests/ -v --tb=short --model-dir=models/${{ matrix.name }}

      - name: Run integration test
        run: |
          mkdir -p "$PWD/ci-artifacts"
          docker run --rm --entrypoint "" \
            -e FAIR_FORCE_CPU=1 \
            -e FAIR_CI_ONNX_EXPORT_DIR=/workspace/ci-artifacts \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${{ matrix.name }}:test" \
            python -m pytest -o addopts='' models/test_integration.py -v --tb=short -m slow --model-dir=models/${{ matrix.name }}
          test -s "$PWD/ci-artifacts/${{ matrix.name }}.onnx"

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          target: runtime
          load: true
          tags: ${{ matrix.name }}:runtime
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Push runtime image
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag "${{ matrix.name }}:runtime" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - uses: docker/metadata-action@v5
        id: inference-meta
        with:
          images:
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/fair-models/${{
            matrix.name }}
          tags: |
            type=ref,event=pr,prefix=pr-,suffix=-inference
            type=raw,value=v${{ matrix.version }}-inference,enable={{is_default_branch}}
            type=raw,value=latest-inference,enable={{is_default_branch}}

      - name: Build inference image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          target: inference
          load: true
          tags: ${{ matrix.name }}:inference
          labels: ${{ steps.inference-meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-inference
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-inference

      - name: Smoke test inference image (baseline ONNX, one-shot)
        if: hashFiles(format('models/{0}/artifacts/{0}.onnx', matrix.name)) != ''
        run: |
          python3 scripts/smoke_test_inference_image.py \
            --image "${{ matrix.name }}:inference" \
            --model-module "models.${{ matrix.name }}.pipeline" \
            --model-uri "/workspace/models/${{ matrix.name }}/artifacts/${{ matrix.name }}.onnx" \
            --image-uri "https://tiles.openaerialmap.org/62d85d11d8499800053796c1/0/62d85d11d8499800053796c2/{z}/{x}/{y}" \
            --bbox "85.5162048339844,27.6312238466813,85.5244445800781,27.6385236142719" \
            --zoom 18 \
            --container-name "${{ matrix.name }}-smoke-base" \
            --output "$PWD/ci-artifacts/${{ matrix.name }}-predictions-base.geojson"

      - name: Smoke test inference image (finetuned ONNX)
        run: |
          python3 scripts/smoke_test_inference_image.py \
            --image "${{ matrix.name }}:inference" \
            --model-module "models.${{ matrix.name }}.pipeline" \
            --model-uri "/workspace/ci-artifacts/${{ matrix.name }}.onnx" \
            --image-uri "https://tiles.openaerialmap.org/62d85d11d8499800053796c1/0/62d85d11d8499800053796c2/{z}/{x}/{y}" \
            --bbox "85.5162048339844,27.6312238466813,85.5244445800781,27.6385236142719" \
            --zoom 18 \
            --container-name "${{ matrix.name }}-smoke-finetuned" \
            --output "$PWD/ci-artifacts/${{ matrix.name }}-predictions-finetuned.geojson"

      - name: Upload smoke predictions (base + finetuned)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-predictions-${{ matrix.name }}
          path: |
            ci-artifacts/${{ matrix.name }}-predictions-base.geojson
            ci-artifacts/${{ matrix.name }}-predictions-finetuned.geojson
          if-no-files-found: ignore

      - name: Push inference image
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag "${{ matrix.name }}:inference" "$tag"
            docker push "$tag"
          done <<< "${{ steps.inference-meta.outputs.tags }}"
