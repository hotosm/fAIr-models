name: K8s Integration Test

on:
  push:
    branches: [master]
    paths:
      - "fair/**"
      - "examples/**"
      - "models/**"
      - "stacks/**"
      - "infra/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/k8s-integration.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k8s-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: extractions/setup-just@v2

      - uses: helm/kind-action@v1
        with:
          cluster_name: fair
          config: infra/kind-config.yaml

      - uses: helmfile/helmfile-action@v2
        with:
          helmfile-args: version

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CLI image
        run: |
          docker pull ghcr.io/hotosm/fair-models/fair-dev-cli:latest
          docker tag ghcr.io/hotosm/fair-models/fair-dev-cli:latest fair-dev-cli:latest

      - name: Install dependencies
        run: uv sync --extra k8s --extra serve

      - name: Deploy stack
        working-directory: infra
        run: just up

      - name: Run example pipelines
        working-directory: infra
        run: just example
