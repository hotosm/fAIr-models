name: K8s Integration Test

on:
  push:
    branches: [master]
    paths:
      - "fair/**"
      - "examples/**"
      - "models/**"
      - "stacks/**"
      - "infra/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/k8s-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k8s-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: extractions/setup-just@v2

      - uses: helm/kind-action@v1
        with:
          cluster_name: fair
          config: infra/kind-config.yaml

      - uses: helmfile/helmfile-action@v2
        with:
          helmfile-args: version

      - name: Install dependencies
        run: uv sync --extra k8s --extra serve --group example

      - name: Deploy stack
        working-directory: infra
        run: just up

      - name: Run example pipelines
        working-directory: infra
        run: just example
