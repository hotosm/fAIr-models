name: Test Single Model

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model directory under models/ (e.g. unet_segmentation)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.model }}
  cancel-in-progress: true

jobs:
  test-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: extractions/setup-just@v2

      - uses: helm/kind-action@v1
        with:
          cluster_name: fair
          config: infra/kind-config.yaml

      - uses: helmfile/helmfile-action@v2
        with:
          helmfile-args: version

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CLI image
        run: |
          docker pull ghcr.io/hotosm/fair-models/fair-dev-cli:latest
          docker tag ghcr.io/hotosm/fair-models/fair-dev-cli:latest fair-dev-cli:latest

      - name: Install dependencies
        run: uv sync --extra k8s --extra serve

      - name: Verify model directory
        run: |
          for f in Dockerfile pipeline.py stac-item.json; do
            test -f "models/${{ inputs.model }}/$f" || { echo "models/${{ inputs.model }}/$f not found"; exit 1; }
          done

      - name: Build model runtime image
        run: just build ${{ inputs.model }}

      - name: Load image into kind cluster
        run: |
          href=$(python3 scripts/stac_asset.py "models/${{ inputs.model }}/stac-item.json" mlm:training)
          kind load docker-image "$href" --name fair

      - name: Deploy stack
        working-directory: infra
        run: just up

      - name: Alias cluster service names to localhost
        run: |
          echo "127.0.0.1 minio.fair.svc zenml.fair.svc mlflow.fair.svc stac.fair.svc" | sudo tee -a /etc/hosts

      - name: Register k8s ZenML stack
        run: |
          uv run zenml init
          infra/scripts/register-k8s-stack.sh

      - name: Run example pipeline
        run: just example ${{ inputs.model }}

      - name: Smoke-test inference container
        run: just test-serve ${{ inputs.model }}
