# Default KNative Service shape, used when a caller supplies no template of its own.
# build_knative_manifest injects the per-model fields (name, namespace, image,
# MODEL_MODULE env, and any fair:cpu/memory/node overrides from the STAC item). Callers
# pass a deployment-specific template via ensure_knative_service(template_path=...).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: model
  namespace: predict
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "5"
        autoscaling.knative.dev/scale-down-delay: "60s"
    spec:
      containerConcurrency: 1
      containers:
        - image: model
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: s3-credentials
          env:
            - name: FAIR_KNATIVE_ONNX_THREADS
              value: "0"
            - name: FAIR_KNATIVE_CORS_ORIGINS
              value: "*"
            - name: FAIR_KNATIVE_CORS_METHODS
              value: "*"
            - name: FAIR_KNATIVE_CORS_HEADERS
              value: "*"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
