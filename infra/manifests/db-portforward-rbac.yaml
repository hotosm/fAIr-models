apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-portforward
  namespace: fair
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-portforward
  namespace: fair
rules:
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-portforward
  namespace: fair
subjects:
  - kind: ServiceAccount
    name: db-portforward
    namespace: fair
roleRef:
  kind: Role
  name: db-portforward
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-wide read on every resource the built-in `view`
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: db-portforward-view
subjects:
  - kind: ServiceAccount
    name: db-portforward
    namespace: fair
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
# `view` is namespace-scoped
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: db-portforward-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csinodes", "csidrivers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: db-portforward-cluster-read
subjects:
  - kind: ServiceAccount
    name: db-portforward
    namespace: fair
roleRef:
  kind: ClusterRole
  name: db-portforward-cluster-read
  apiGroup: rbac.authorization.k8s.io
