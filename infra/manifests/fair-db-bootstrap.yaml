apiVersion: batch/v1
kind: Job
metadata:
  name: fair-db-bootstrap
  namespace: fair
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: imresamu/postgis:17-3.5
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              value: postgres
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until pg_isready -h "$PGHOST" -U "$PGUSER" -t 5; do
                echo "waiting for postgres..."; sleep 2;
              done
              psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='fair'" | grep -q 1 \
                || psql -d postgres -c "CREATE DATABASE fair"
              psql -d fair -c "CREATE EXTENSION IF NOT EXISTS postgis"
              psql -d fair -c "CREATE EXTENSION IF NOT EXISTS btree_gist"
              echo "fair database ready"
