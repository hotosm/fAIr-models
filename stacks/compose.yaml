# yaml-language-server: $schema=
stack_name: compose
zenml_version: 0.94.2
components:
  orchestrator:
    name: docker_compose
    flavor: local_docker
    type: orchestrator
    configuration:
      synchronous: true
      run_args:
        network: host
        user: "0"
        environment:
          AWS_ENDPOINT_URL: http://localhost:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
  artifact_store:
    name: s3_compose
    flavor: s3
    type: artifact_store
    configuration:
      path: s3://zenml
      key: minioadmin
      secret: minioadmin
      client_kwargs:
        endpoint_url: "http://localhost:9000"
  experiment_tracker:
    name: mlflow_compose
    flavor: mlflow
    type: experiment_tracker
    configuration:
      tracking_uri: "http://localhost:5000"
      tracking_username: admin
      tracking_password: admin
