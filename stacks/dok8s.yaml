# yaml-language-server: $schema=
stack_name: dok8s
zenml_version: 0.94.2

_pod_defaults: &pod_defaults
  env:
    - name: ZENML_STORE_URL
      value: "http://zenml.fair.svc:80"
    - name: AWS_ENDPOINT_URL
      value: "https://s3.${FAIR_DOMAIN}"
    - name: AWS_ACCESS_KEY_ID
      value: minioadmin
    - name: AWS_SECRET_ACCESS_KEY
      value: minioadmin
    - name: FAIR_S3_PUBLIC_URL
      value: "https://s3.${FAIR_DOMAIN}"
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: "when_required"
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: "when_required"
  node_selectors:
    fair/workload: ml

components:
  orchestrator:
    name: doks_orchestrator
    flavor: kubernetes
    type: orchestrator
    configuration:
      kubernetes_context: ${DOKS_CONTEXT}
      kubernetes_namespace: fair
      pod_settings: *pod_defaults
      orchestrator_pod_settings: *pod_defaults
  artifact_store:
    name: s3_artifacts
    flavor: s3
    type: artifact_store
    configuration:
      path: s3://zenml
      key: minioadmin
      secret: minioadmin
      client_kwargs:
        endpoint_url: "https://s3.${FAIR_DOMAIN}"
  container_registry:
    name: ghcr
    flavor: default
    type: container_registry
    configuration:
      uri: ghcr.io/hotosm
  experiment_tracker:
    name: mlflow_tracker
    flavor: mlflow
    type: experiment_tracker
    configuration:
      tracking_uri: "http://mlflow.fair.svc:80"
      tracking_username: ${MLFLOW_ADMIN_USER}
      tracking_password: ${MLFLOW_ADMIN_PASSWORD}
